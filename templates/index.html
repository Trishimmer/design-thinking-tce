<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crop Prediction System</title>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: auto;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: black;
        color: #333;
        overflow-x: hidden;
        padding: 40px 20px;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("https://images.unsplash.com/photo-1506782647330-5a108cc5d07b?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1920")
          no-repeat center center/cover;
        filter: blur(8px) brightness(0.7);
        z-index: -1;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 30px 25px;
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        animation: fadeIn 1.2s ease;
        text-align: center;
      }

      h1 {
        font-size: 2.7em;
        color: #0d2c54;
        margin-bottom: 25px;
        font-weight: 700;
      }

      form {
        text-align: left;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #333;
        font-size: 1rem;
      }

      input {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 25px;
        border: 1.5px solid #bbb;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease-in-out;
        background: #f8f9fa;
      }

      input::placeholder {
        color: #7a7a7a;
      }

      input:focus {
        border-color: #43cea2;
        box-shadow: 0 0 10px rgba(67, 206, 162, 0.4);
        outline: none;
      }

      input:hover {
        transform: scale(1.03);
      }

      button {
        width: 100%;
        padding: 15px;
        font-size: 1.1em;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #43cea2, #185a9d);
        color: #fff;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      button:hover {
        background: linear-gradient(90deg, #185a9d, #43cea2);
        transform: scale(1.05);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      }

      footer {
        margin-top: 30px;
        font-size: 0.95em;
        color: #333;
      }

      footer a {
        color: #2e7d32;
        text-decoration: none;
        font-weight: 600;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @media screen and (max-width: 600px) {
        .container {
          padding: 25px 20px;
        }

        h1 {
          font-size: 2em;
        }

        input,
        button {
          font-size: 1em;
        }
      }

      .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .loader {
        border: 10px solid #f3f3f3;
        border-top: 10px solid #43cea2;
        border-bottom: 10px solid #185a9d;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        animation: spin 1s linear infinite;
      }
    </style>
  </head>
  <body>
    <!-- 🔁 Loader Overlay -->
    <div class="loader-overlay" id="loaderOverlay">
      <div class="loader"></div>
    </div>

    <!-- 🌱 Form Container -->
    <div class="container">
      <h1>🌾 Crop Prediction System</h1>
      <form action="/predict_crop" method="POST" id="cropForm" novalidate enctype="multipart/form-data">
        <label for="nitrogen">Nitrogen (N):</label>
        <input type="number" name="nitrogen" id="nitrogen" placeholder="0 - 140" />

        <label for="phosphorus">Phosphorus (P):</label>
        <input type="number" name="phosphorus" id="phosphorus" placeholder="0 - 145" />

        <label for="potassium">Potassium (K):</label>
        <input type="number" name="potassium" id="potassium" placeholder="0 - 205" />

        <label for="temperature">Temperature (°C):</label>
        <input type="number" name="temperature" id="temperature" placeholder="0 - 50" />

        <label for="humidity">Humidity (%):</label>
        <input type="number" name="humidity" id="humidity" placeholder="0 - 100" />

        <label for="ph">pH Level:</label>
        <input type="number" step="0.1" name="ph" id="ph" placeholder="0 - 14" />

        <label for="rainfall">Rainfall (mm):</label>
        <input type="number" name="rainfall" id="rainfall" placeholder="0 - 300" />

        <label for="sat_image">Upload satellite GeoTIFF (Red + NIR bands):</label>
        <input type="file" name="sat_image" id="sat_image" accept=".tif,.tiff" />
        <small style="display:block;margin-bottom:20px;color:#6b7280">Optional: provide a GeoTIFF containing Red and NIR bands to compute NDVI.</small>
        
        <label for="latitude">Latitude (optional):</label>
        <input type="number" step="0.000001" name="latitude" id="latitude" placeholder="e.g. 9.8782" />

        <label for="longitude">Longitude (optional):</label>
        <input type="number" step="0.000001" name="longitude" id="longitude" placeholder="e.g. 78.0547" />

        <!-- 📍 Button to Autofill from Weather -->
        <button type="button" onclick="fetchWeather()" style="margin-bottom: 20px; background-color: #4caf50;">
          📍 Use Current Weather
        </button>

        <!-- 🌱 Predict Button -->
        <button type="submit">🌱 Predict Crop</button>
      </form>
      <a href="{{ url_for('ndvi_analysis') }}" style="display:block;margin-top:16px;padding:15px;text-align:center;font-size:1.1em;font-weight:bold;border-radius:12px;background:#0d2c54;color:#fff;text-decoration:none;">🛰️ Analyze Historical NDVI</a>
    </div>

    <!-- 🚀 Script for Weather Autofill and Submit Delay -->
    <script>
      const form = document.getElementById("cropForm");
      const loader = document.getElementById("loaderOverlay");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        loader.style.display = "flex";
        setTimeout(() => {
          form.submit();
        }, 3000);
      });

      async function fetchWeather() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(async function (position) {
            const lat = 9.8782;
            const lon = 78.0547;
            const apiKey = "b6595bf4c0273294c6e0aee327798b96"; // 🔑 Replace with your OpenWeatherMap API key

            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${apiKey}`;

            try {
              const response = await fetch(url);
              const data = await response.json();

              // ✅ Round temperature to nearest integer
              document.getElementById("temperature").value = Math.round(data.main.temp);
              document.getElementById("humidity").value = data.main.humidity;

             
              alert("Weather data autofilled!");
            } catch (error) {
              alert("Failed to fetch weather data.");
              console.error(error);
            }
          });
        } else {
          alert("Geolocation is not supported by this browser.");
        }
      }
    </script>
  </body>
</html>
